<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal - Security Challenge</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PayPalOpen-Regular", "Helvetica Neue", Helvetica, Arial, sans-serif; }
        body { background: #ffffff; color: #001435; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
        .paypal-logo { font-size: 2rem; font-weight: 900; font-style: italic; color: #003087; letter-spacing: -1px; margin-bottom: 2.5rem; }
        .paypal-logo span { color: #0079C1; }
        h1 { font-size: 1.75rem; font-weight: 800; color: #001435; margin-bottom: 2rem; }
        .challenge-box { border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 2.5rem 3.5rem; max-width: 440px; margin-bottom: 2rem; font-size: 0.95rem; color: #4b5563; }
        .feedback-text { font-size: 0.8rem; color: #64748b; margin-bottom: 0.5rem; }
        .feedback-text a { color: #0070ba; text-decoration: underline; }
        .tracking-id { font-size: 0.72rem; color: #001435; font-weight: 700; font-family: monospace; }
    </style>
</head>
<body>
    <div class="paypal-logo">Pay<span>Pal</span></div>
    <h1>You have been blocked.</h1>
    <div class="challenge-box">
        We couldn't load the security challenge.
    </div>
    <div class="feedback-text">
        Having trouble? <a href="#">Submit feedback</a>
    </div>
    <div class="tracking-id">
        ID: 6cbc344b-fb41-957c-8b24-7c4a42cf9029
    </div>
</body>
</html>
