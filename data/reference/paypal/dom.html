<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to your PayPal account</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PayPalOpen-Regular", "Helvetica Neue", Helvetica, Arial, sans-serif; }
        body { background-color: #ffffff; color: #2c2e2f; display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; }
        .login-wrapper { display: flex; justify-content: center; align-items: center; flex: 1; padding: 2rem 1rem; }
        .paypal-card { width: 100%; max-width: 460px; padding: 3rem 2.5rem 2.5rem; border: 1px solid #eaeced; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04); text-align: center; }
        .paypal-logo { font-size: 2rem; font-weight: 900; font-style: italic; color: #003087; letter-spacing: -1px; margin-bottom: 2.2rem; }
        .paypal-logo span { color: #0079C1; }
        .form-group { margin-bottom: 1.25rem; text-align: left; }
        .input-field { width: 100%; height: 48px; padding: 0 1rem; font-size: 1rem; border: 1px solid #94a3b8; border-radius: 6px; outline: none; transition: border-color 0.2s ease; }
        .input-field:focus { border-color: #0070ba; box-shadow: 0 0 0 1px #0070ba; }
        .recovery-link { display: block; text-align: left; color: #0070ba; font-size: 0.92rem; font-weight: 600; text-decoration: none; margin-bottom: 1.5rem; }
        .recovery-link:hover { text-decoration: underline; }
        .btn-next { width: 100%; height: 48px; background-color: #0070ba; color: #ffffff; border: none; border-radius: 24px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background-color 0.2s ease; }
        .btn-next:hover { background-color: #005ea6; }
        .split-divider { position: relative; text-align: center; margin: 1.5rem 0; }
        .split-divider::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background-color: #cbd5e1; z-index: 1; }
        .split-divider span { position: relative; background-color: #ffffff; padding: 0 1rem; color: #64748b; font-size: 0.88rem; z-index: 2; }
        .btn-signup { display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 48px; background-color: #ffffff; color: #2c2e2f; border: 1.5px solid #2c2e2f; border-radius: 24px; font-size: 1rem; font-weight: 700; text-decoration: none; cursor: pointer; }
        .btn-signup:hover { background-color: #f8fafc; }
        .country-selector { display: flex; align-items: center; justify-content: center; margin-top: 2rem; gap: 0.4rem; cursor: pointer; }
        .country-flag { width: 22px; height: 15px; background: linear-gradient(180deg, #FF9933 33%, #FFFFFF 33%, #FFFFFF 66%, #138808 66%); border-radius: 2px; }
        .country-arrow { font-size: 0.75rem; color: #64748b; }
        .footer-links { background-color: #ffffff; padding: 1.5rem; text-align: center; font-size: 0.78rem; color: #64748b; border-top: 1px solid #f1f5f9; }
        .footer-links a { color: #64748b; text-decoration: none; margin: 0 0.6rem; font-weight: 500; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <main class="paypal-card">
            <div class="paypal-logo">Pay<span>Pal</span></div>
            <form action="https://www.paypal.com/signin" method="POST" id="loginForm">
                <input type="hidden" name="csrf_token" value="canonical_paypal_auth_session_token" />
                <div class="form-group">
                    <input type="text" id="email" name="login_email" class="input-field" placeholder="Email or mobile number" required autocomplete="username" />
                </div>
                <a href="https://www.paypal.com/authflow/password-recovery/" class="recovery-link">Forgotten your email?</a>
                <button type="submit" id="btnNext" class="btn-next">Next</button>
            </form>
            <div class="split-divider">
                <span>or</span>
            </div>
            <a href="https://www.paypal.com/in/webapps/mpp/account-selection" class="btn-signup">Sign Up</a>
            <div class="country-selector">
                <div class="country-flag" title="India"></div>
                <span class="country-arrow">&#9662;</span>
            </div>
        </main>
    </div>
    <footer class="footer-links">
        <a href="https://www.paypal.com/in/smarthelp/contact-us">Contact Us</a>
        <a href="https://www.paypal.com/in/webapps/mpp/ua/privacy-full">Privacy</a>
        <a href="https://www.paypal.com/in/webapps/mpp/ua/legal-hub">Legal</a>
        <a href="https://www.paypal.com/in/webapps/mpp/country-worldwide">Worldwide</a>
    </footer>
</body>
</html>
